[project]
name = "zhixing-next-backend"
version = "0.1.0"
description = "Single-user persistent personal assistant backend"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.34,<1",
  "deepagents>=0.4,<1",
  "langgraph-checkpoint-sqlite>=3,<4",
  "langchain-openai>=1,<2",
  "langchain-google-genai>=4,<5",
  "filelock>=3.18,<4",
  "httpx>=0.28,<1",
  "pypdf>=6,<7",
  "pillow>=12,<13",
]

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-asyncio>=1,<2", "httpx>=0.28,<1", "ruff>=0.11,<1"]
sandbox = [
    "matplotlib>=3.10,<4",
    "openpyxl>=3.1,<4",
    "pandas>=2,<4",
    "pillow>=12,<13",
    "playwright>=1.58,<2",
    "pypdf>=6,<7",
    "python-docx>=1.2,<2",
    "python-pptx>=1,<2",
    "reportlab>=4,<5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/zhixing_next"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
