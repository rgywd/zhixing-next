# Copy to an ignored local file, e.g. config.local.toml. All paths are relative to this file.
data_dir = ".data"
workspace_root = ".data/workspaces"
api_token_env = "ZHIXING_API_TOKEN"

[roles]
chat = "primary"
task = "primary"
# Memory organization uses the chat model unless a separate memory role is set.

# Replace model IDs with models actually available from your provider.
[models.primary]
protocol = "gemini"
model = "YOUR_GEMINI_MODEL_ID"
# Enable only after verifying this endpoint/model supports image input.
image_input = false
provider = "Gemini"
api_key_env = "ZHIXING_GEMINI_API_KEY"
# Gemini 3 models may declare: reasoning_levels = ["auto", "low", "medium", "high"]

# [models.execution]
# protocol = "responses"
# model = "YOUR_RESPONSES_MODEL_ID"
# api_key_env = "ZHIXING_OPENAI_API_KEY"
# base_url = "https://your-provider.example/v1"

# [models.memory]
# protocol = "chat_completions"
# model = "YOUR_COMPATIBLE_MODEL_ID"
# api_key_env = "ZHIXING_COMPATIBLE_API_KEY"
# base_url = "https://your-provider.example/v1"

# Directory grants are server-side configuration, never model-generated permissions.
# [[grants]]
# path = "/absolute/path/to/reference-materials"
# writable = false
# overwrite = "ask" # allow only for explicitly authorized persistent replacements.

# Build sandbox/Dockerfile and verify the target host before enabling execution.
[execution]
enabled = false
image = "zhixing-sandbox:1"
network = "none" # bridge also allows Docker-reachable private networks.
network_authorization = "ask" # bridge: once per task; allow means persistent authorization.
memory_mb = 2048
cpus = 2
timeout_seconds = 120
# Optional dedicated folder containing <skill-name>/SKILL.md. Snapshotted read-only.
# skills_dir = "./skills"

[limits]
model_attempts = 80 # Includes retries and child agents, across recovery.
tool_calls = 160
total_tokens = 1000000 # Stops the next call after the reported cumulative limit.
active_seconds = 1800
retries = 3
retry_base_seconds = 1

# Scoped GitLab integration. Enable only projects the assistant should access.
[gitlab]
url = "https://gitlab.com" # Or your self-hosted HTTPS instance.
token_env = "ZHIXING_GITLAB_TOKEN"
projects = [] # Numeric project IDs or namespace/project paths; at most 30.
allow_writes = false # true exposes issue creation/update, each requiring App approval.
