name: Android release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

concurrency:
  group: android-release
  cancel-in-progress: false

jobs:
  verify:
    name: Release regression
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Validate release tag and Android version
        run: python3 scripts/github_release.py validate
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.12.19"
          enable-cache: true
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test:mobile
      - run: python3 -m unittest discover -s tests -p test_github_release.py
      - run: npm run bundle:android
      - run: npm run bundle:ios
      - name: Backend and real Docker regression
        working-directory: backend
        run: |
          uv sync --locked --python 3.12
          uv run ruff check .
          uv run pytest -q
          docker build -t zhixing-sandbox:1 sandbox
          ZHIXING_TEST_DOCKER=1 uv run pytest -q tests/test_execution.py tests/test_harness.py

  publish:
    name: Signed Android APK and GitHub Release
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - run: python3 scripts/github_release.py validate
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "17"
      - run: npm ci
      - name: Set up matching Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          cmdline-tools-version: "12266719"
          accept-android-sdk-licenses: "true"
          log-accepted-android-sdk-licenses: "false"
          packages: "platform-tools platforms;android-36 build-tools;36.0.0 ndk;27.1.12297006 cmake;3.22.1"
      - name: Verify Android SDK tools
        run: |
          test "$ANDROID_HOME" = "$ANDROID_SDK_ROOT"
          command -v sdkmanager
          test -x "$ANDROID_HOME/build-tools/36.0.0/apksigner"
          test -x "$ANDROID_HOME/cmake/3.22.1/bin/cmake"
      - name: Build and verify with the existing release certificate
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: python3 scripts/github_release.py build
      - name: Upload verified assets, then publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/github_release.py publish
